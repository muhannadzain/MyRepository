[package]
name = "codepost"
version = "0.1.0"
edition = "2021"

[lib]
name = "codepost"
crate-type = ["cdylib", "rlib"]

[dependencies]
# Sandboxed scripting for post code blocks (pure Rust: no file/network/process access exists in the engine).
rhai = { version = "1", features = ["no_module", "no_time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"

[target.'cfg(target_os = "android")'.dependencies]
eframe = { version = "0.31", default-features = false, features = ["android-native-activity", "glow", "default_fonts"] }
winit = { version = "0.30", features = ["android-native-activity"] }
android_logger = "0.14"

[profile.release]
opt-level = 2
strip = true

[package.metadata.android]
package = "dev.muhannad.codepost"
apk_name = "CodePost"
build_targets = ["aarch64-linux-android"]

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 34

[package.metadata.android.application]
label = "CodePost"
