name: Build MIRQA Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master", "mirqa" ]
    paths:
      - "app/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Run unit tests
        run: gradle testDebugUnitTest

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MIRQA-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk MIRQA.apk

      - name: Publish to Releases (easy download from phone)
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mirqa-latest
          name: MIRQA (latest build)
          files: MIRQA.apk
